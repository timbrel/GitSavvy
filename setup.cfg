[flake8]
# Transitional unused-import check: unlike Ruff, flake8 reads legacy type comments.
select = F401
exclude =
  tests/mockito,
  tests/parameterized/,
  .svn,CVS,.bzr,.hg,.git,.venv
per-file-ignores =
    **/__init__.py:F401
    git_savvy.py:F401

[codespell]
skip = docs/_build,.mypy_cache,*.sublime-workspace,.git,tests/mockito,tests/parameterized
; mockito uses atleast as a keyword
ignore-words-list=atleast,commitish,falsy
